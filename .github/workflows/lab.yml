name: Root Detection Lab

on:
  push:
    branches: [ main, "claude/**" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast: pure Kotlin + C++ rules against lab/fixtures (no Android SDK needed).
  host-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run rule lab
        run: gradle -p lab/host test --no-daemon
      - name: Publish report
        if: always()
        run: '[ -f lab/REPORT.md ] && cat lab/REPORT.md >> "$GITHUB_STEP_SUMMARY" || true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-lab-report
          path: lab/REPORT.md

  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Install NDK + CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.1.12297006" "cmake;3.22.1" > /dev/null
      - name: Build demo APK (debug for the lab, release to catch R8/minify issues)
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  # Real: live x86_64 emulator + real Frida server/agent + real JDWP debugger.
  emulator-lab:
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [ 30, 34 ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-debug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frida-tools
        run: pip install frida-tools
      - name: Run scenarios on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash lab/emulator/run_scenarios.sh app-debug.apk baseline frida_server frida_attach jdwp_debugger
      - name: Check results
        if: always()
        run: |
          set -o pipefail
          python3 lab/emulator/check.py lab/emulator/out ${{ matrix.api }} | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-lab-api${{ matrix.api }}
          path: lab/emulator/out

  # Experimental: Magisk via rootAVD. Report-only until proven stable.
  magisk-lab:
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    env:
      SYSIMG: "system-images;android-30;google_apis;x86_64"
      # avdmanager and emulator must agree on where AVDs live (they did not by default).
      ANDROID_AVD_HOME: /home/runner/.android/avd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-debug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Create AVD
        run: |
          mkdir -p "$ANDROID_AVD_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$SYSIMG" emulator platform-tools > /dev/null || true
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n lab -k "$SYSIMG" --force
          "$ANDROID_HOME/emulator/emulator" -list-avds
      - name: Root with rootAVD and scan
        timeout-minutes: 30
        run: bash lab/emulator/magisk_lab.sh app-debug.apk lab system-images/android-30/google_apis/x86_64/ramdisk.img
      - name: Check results
        if: always()
        run: |
          set -o pipefail
          python3 lab/emulator/check.py lab/emulator/out magisk-api30 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: magisk-lab
          path: |
            lab/emulator/out
            /tmp/emulator.log
