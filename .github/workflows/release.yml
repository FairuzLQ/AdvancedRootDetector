name: Release APK

on:
  push:
    tags: [ "v*" ]
    # A branch push releases only when the commit message contains "[release]"
    # (used when tags cannot be pushed directly); the tag is then created by the release.
    branches: [ main, "claude/**" ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (must match versionName, e.g. v1.6.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/') ||
      contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    env:
      INPUT_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Install NDK + CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.1.12297006" "cmake;3.22.1" > /dev/null

      - name: Check tag matches versionName
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          tag="${INPUT_TAG:-v$version}"
          echo "versionName=$version tag=$tag"
          [ "v$version" = "$tag" ] || { echo "::error::tag $tag does not match versionName $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNED_WITH=the project release key" >> "$GITHUB_ENV"
          else
            echo "SIGNED_WITH=a CI debug key (RELEASE_KEYSTORE_BASE64 secret not configured) — uninstall builds signed with another key before installing" >> "$GITHUB_ENV"
          fi

      - name: Build release APK + library AAR
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease :rootdetector:assembleRelease --no-daemon
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/AdvancedRootDetector-v$VERSION.apk"
          cp rootdetector/build/outputs/aar/rootdetector-release.aar "dist/rootdetector-v$VERSION.aar"
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" \
            verify --print-certs "dist/AdvancedRootDetector-v$VERSION.apk" | tee dist/signing.txt

      - name: Release notes
        run: |
          # Section "## [x.y.z] — Title" in CHANGELOG.md → release title + body
          title=$(sed -n "s/^## \[$VERSION\] — //p" CHANGELOG.md | head -1)
          echo "RELEASE_NAME=v$VERSION${title:+ — $title}" >> "$GITHUB_ENV"
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "## Downloads"
            echo "- \`app-release.apk\` — Demo app"
            echo "- \`rootdetector-release.aar\` — Library AAR"
            echo
            echo "> APK signed with $SIGNED_WITH."
          } >> notes.md
          cat notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "dist/AdvancedRootDetector-v$VERSION.apk" dist/app-release.apk
          cp "dist/rootdetector-v$VERSION.aar" dist/rootdetector-release.aar
          (cd dist && sha256sum app-release.apk rootdetector-release.aar > SHA256SUMS.txt)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # Re-release: replace title, notes and every asset
            for a in $(gh release view "$RELEASE_TAG" --json assets -q '.assets[].name'); do
              gh release delete-asset "$RELEASE_TAG" "$a" -y
            done
            gh release edit "$RELEASE_TAG" --title "$RELEASE_NAME" --notes-file notes.md
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_NAME" --notes-file notes.md
          fi
          gh release upload "$RELEASE_TAG" dist/app-release.apk dist/rootdetector-release.aar dist/SHA256SUMS.txt --clobber
